server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fingerprinted bundles never change contents, so they can be cached hard.
  # `^~` so this wins over the regex block below and keeps its cache headers.
  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A missing asset must 404, not fall through to index.html. Otherwise the browser gets
  # HTML where it asked for an image or a script — index.html references /vite.svg, which
  # this project has no public/ directory to supply.
  location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|json|txt|mp4|webm|mp3)$ {
    try_files $uri =404;
  }

  # Single-page app: unknown *routes* fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must not be cached, or a rebuild keeps serving the old bundle names.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
